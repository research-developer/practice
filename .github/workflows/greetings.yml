name: Greet Contributors

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    
    steps:
    - name: Greet new contributors
      uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: |
          👋 Thanks for opening your first issue! We appreciate your contribution to this practice repository.
          
          This is a practice repository designed for testing GitHub automations. Feel free to experiment!
        pr-message: |
          🎉 Thanks for opening your first pull request! We appreciate your contribution to this practice repository.
          
          This is a practice repository designed for testing GitHub automations. Feel free to experiment!
