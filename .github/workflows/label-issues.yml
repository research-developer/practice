name: Label Issues

on:
  issues:
    types: [opened, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    
    steps:
    - name: Label bug reports
      if: contains(github.event.issue.title, '[BUG]') || contains(github.event.issue.title, 'bug')
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            labels: ['bug']
          })
    
    - name: Label feature requests
      if: contains(github.event.issue.title, '[FEATURE]') || contains(github.event.issue.title, 'feature')
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            labels: ['enhancement']
          })
    
    - name: Label practice tasks
      if: contains(github.event.issue.title, '[PRACTICE]') || contains(github.event.issue.title, 'practice')
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            labels: ['practice', 'good first issue']
          })
    
    - name: Label documentation issues
      if: contains(github.event.issue.title, 'documentation') || contains(github.event.issue.title, 'docs')
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            labels: ['documentation']
          })
